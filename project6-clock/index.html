<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/hgu2igm.css">
    <title>Clock</title>
  </head>
  <body>
  <div id="clock"></div>

  <div class="buttonrow">
    <button id="start-btn"><img src="musicbutton.png" alt="background music"></button>
    <a href="break.html"><div class="breakbutton"><img src="breakbutton.png" alt="Go for break and live music"></div></a>
  </div>

  <img class="scene" id="night" src="clock-night.png" alt="night">
  <img class="scene" id="dawn" src="clock-dawn.png" alt="dawn">
  <img class="scene" id="day" src="clock-day.png" alt="day">
  <img class="scene" id="evening" src="clock-evening.png" alt="evening">

  <script src="./script.js"></script>
</body>
</html>
